[project]
name = "fairinogale"
version = "1.0.0"
description = "Fairino robot arm as an Arkitekt app: pick-and-place routines between the stations of a staining workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The Arkitekt family moves together: one tested set for every stainSTORM app, bumped together.
    "arkitekt[rekuest]==19.0.1",
    "arkitekt-runtime==11.0.0",
    "arkitekt-spec==14.1.0",
    "rekuest==19.1.0",
    "fakts==6.8.2",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
